<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C96A"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#9A7A2E"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A2B"/>
      <stop offset="1" stop-color="#5F3A1A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="#0B0B0E"/>

  <g transform="translate(256 256) rotate(-35)">
    <!-- Handle (cabo) -->
    <rect x="-26" y="-16" width="52" height="330" rx="14" fill="url(#handle)"/>
    <rect x="-12" y="40" width="24" height="258" rx="8" fill="#A96E33" opacity="0.55"/>

    <!-- Axe head (cabeça do machado) -->
    <path d="M -52 -120
             A 150 88 0 0 1 128 -120
             L 128 -30
             L -52 -30 Z"
          fill="url(#blade)"
          stroke="#5D4516" stroke-width="6"/>
    <path d="M -52 -120
             A 150 88 0 0 1 128 -120
             L -52 -30 Z"
          fill="#FFF3C4" opacity="0.28"/>
  </g>
</svg>
